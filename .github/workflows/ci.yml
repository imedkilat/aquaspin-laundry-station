name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install backend test dependencies
        run: npm ci --prefix tests/backend

      - name: Run backend and Edge Function tests
        run: npm test --prefix tests/backend

      - name: Run customer item tests
        run: npm run test:customer-items

      - name: Run sales metrics tests
        run: npm run test:sales-metrics

      - name: Run staff account tests
        run: npm run test:staff-accounts

      - name: Run receipt tests
        run: npm run test:receipt

      - name: Run public tracking tests
        run: npm run test:public-tracking

      - name: Run thermal receipt tests
        run: npm run test:thermal-receipt

      - name: Run thermal print modal tests
        run: npm run test:thermal-print-modal

      - name: Run transaction edit tests
        run: npm run test:transaction-edit

      - name: Lint
        run: npx oxlint

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

  rate-limit-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquaspin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aquaspin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: aquaspin_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare isolated database for the production migration
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          create table public.rate_limit_hits (
            id bigint generated by default as identity primary key,
            rate_key text not null,
            created_at timestamptz not null default now()
          );
          SQL
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260930080000_pr36_security_cleanup_and_rate_limit_lock.sql

      - name: Verify concurrent requests respect the same-key limit
        run: node tests/backend/rate-limit-concurrency.mjs
